
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANKITA AI 3.0</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080d1a;
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
 display:flex;
 justify-content:center;
}
.app{
 width:100%;
 max-width:600px;
 height:100vh;
 display:flex;
 flex-direction:column;
 padding:15px;
}
header{
 text-align:center;
 padding:15px;
 border-bottom:1px solid #26334d;
}
header h2{color:#61d5ff;margin:5px}
header p{color:#8da4c9;font-size:13px}
#status{color:#36e6a0;font-size:13px}
#chat{
 flex:1;
 overflow-y:auto;
 padding:15px 0;
}
.message{
 padding:12px 15px;
 border-radius:15px;
 margin:10px 0;
 max-width:85%;
 line-height:1.5;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{
 background:#164e86;
 margin-left:auto;
}
.bot{
 background:#18243a;
 margin-right:auto;
}
.controls{
 display:flex;
 gap:8px;
 padding:10px 0;
}
input{
 flex:1;
 min-width:0;
 background:#172238;
 color:white;
 border:1px solid #34445e;
 border-radius:12px;
 padding:14px;
 font-size:16px;
 outline:none;
}
button{
 background:#087fca;
 color:white;
 border:0;
 border-radius:12px;
 padding:12px 16px;
 font-size:15px;
 cursor:pointer;
}
button:disabled{opacity:.5}
.voice{
 background:#713ee5;
}
footer{
 text-align:center;
 color:#7385a5;
 font-size:12px;
 padding:8px;
}
</style>
</head>

<body>
<div class="app">

<header>
<h2>✦ ANKITA AI 3.0</h2>
<p>Your Personal AI Assistant</p>
<div id="status">● Ready</div>
</header>

<div id="chat">
<div class="message bot">
হ্যালো! আমি ANKITA AI 3.0।
কীভাবে সাহায্য করতে পারি?
</div>
</div>

<div class="controls">
<input id="userInput" placeholder="এখানে কিছু লেখো..." />
<button id="sendBtn" onclick="sendMessage()">Send</button>
<button class="voice" onclick="startVoice()">🎤</button>
</div>

<footer>
ANKITA AI 3.0 | Personal AI Assistant
</footer>

</div>

<script>

// নিজের Render Backend URL এখানে বসবে
const API_URL = "https://ankita-ai-3.onrender.com";

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const statusText = document.getElementById("status");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text,type){
 const div = document.createElement("div");
 div.className = "message " + type;
 div.textContent = text;
 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(){

 const message = input.value.trim();

 if(!message) return;

 addMessage(message,"user");
 input.value = "";

 sendBtn.disabled = true;
 statusText.textContent = "● ANKITA ভাবছে...";

 try{

 const response = await fetch(API_URL + "/brain",{
 method:"POST",
 headers:{
 "Content-Type":"application/json"
 },
 body:JSON.stringify({
 message:message
 })
 });

 const data = await response.json();

 if(!response.ok){
 throw new Error(data.error || "Server Error");
 }

 const reply = data.reply || data.output || "কোনো উত্তর পাওয়া যায়নি।";

 addMessage(reply,"bot");
 speak(reply);

 statusText.textContent = "● Online";

 }catch(error){

 addMessage("সমস্যা হয়েছে: "+error.message,"bot");
 statusText.textContent = "● Connection Error";

 }finally{
 sendBtn.disabled = false;
 }

}

input.addEventListener("keydown",function(e){
 if(e.key==="Enter") sendMessage();
});

// Voice Input

function startVoice(){

 const SpeechRecognition =
 window.SpeechRecognition ||
 window.webkitSpeechRecognition;

 if(!SpeechRecognition){
 alert("তোমার Browser Voice Input Support করছে না।");
 return;
 }

 const recognition = new SpeechRecognition();

 recognition.lang = "bn-IN";
 recognition.interimResults = false;

 statusText.textContent = "● শুনছি...";

 recognition.onresult = function(event){
 input.value = event.results[0][0].transcript;
 sendMessage();
 };

 recognition.onerror = function(){
 statusText.textContent = "● Voice Error";
 };

 recognition.onend = function(){
 if(statusText.textContent==="● শুনছি..."){
 statusText.textContent="● Ready";
 }
 };

 recognition.start();
}

// Voice Response

function speak(text){

 if(!("speechSynthesis" in window)) return;

 window.speechSynthesis.cancel();

 const speech = new SpeechSynthesisUtterance(text);
 speech.lang = /[\u0980-\u09FF]/.test(text) ? "bn-IN" : "en-IN";
 speech.rate = 1;

 window.speechSynthesis.speak(speech);
}

</script>
</body>
</html>
